name: Build and Sign Sổ Bán Hàng

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    name: Build and Sign Sổ Bán Hàng
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare signing tools
        shell: bash
        run: |
          set -euo pipefail

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$BT"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"

          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/apksigner" --version

      - name: Restore APKSIGN keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || {
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is empty."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::ANDROID_SIGNING_STORE_PASSWORD is empty."
            exit 1
          }

          KS="$RUNNER_TEMP/khahdihdz-release.jks"
          CLEAN_B64="$RUNNER_TEMP/keystore.b64"
          DECODED_KS="$RUNNER_TEMP/khahdihdz-release-decoded.jks"

          # Remove whitespace introduced by copying the Base64 value.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > "$CLEAN_B64"

          # Decode the normal Base64-encoded keystore.
          if ! base64 --decode "$CLEAN_B64" > "$KS" 2>/dev/null; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          chmod 600 "$KS"

          # Accept an accidentally double-Base64-encoded keystore.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=]+$' "$KS"; then
              if base64 --decode "$KS" > "$DECODED_KS" 2>/dev/null &&
                 keytool -list -keystore "$DECODED_KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
                mv "$DECODED_KS" "$KS"
              else
                rm -f "$DECODED_KS"
              fi
            fi
          fi

          # Final validation: the keystore and store password must match.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::APKSIGN keystore could not be opened. The Base64 secret and STORE_PASSWORD must belong to the same keystore."
            exit 1
          fi

          echo "APKSIGN keystore restored and validated."

      - name: Align release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="$RUNNER_TEMP/SoBanHang-aligned.apk"

          test -f "$INPUT"
          "$BT/zipalign" -f -p 4 "$INPUT" "$OUTPUT"

      - name: Sign with APKSIGN release key
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/khahdihdz-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/SoBanHang.apk" \
            "$RUNNER_TEMP/SoBanHang-aligned.apk"

      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/SoBanHang.apk"

      - name: Upload signed APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SoBanHang
          path: ${{ runner.temp }}/SoBanHang.apk
          if-no-files-found: error

      - name: Release signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/SoBanHang.apk
