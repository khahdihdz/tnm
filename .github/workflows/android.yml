name: Build and Sign Sổ Bán Hàng

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    name: Build and Sign Sổ Bán Hàng
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare signing tools
        shell: bash
        run: |
          set -euo pipefail

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$BT"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"

          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/apksigner" --version

      - name: Restore APKSIGN keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is empty."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::ANDROID_SIGNING_STORE_PASSWORD is empty."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::ANDROID_SIGNING_KEY_ALIAS is empty."; exit 1; }

          KS="$RUNNER_TEMP/khahdihdz-release.jks"
          CLEAN_B64="$RUNNER_TEMP/keystore.b64"
          DECODED_KS="$RUNNER_TEMP/khahdihdz-release-decoded.jks"

          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > "$CLEAN_B64"
          base64 --decode "$CLEAN_B64" > "$KS" 2>/dev/null || {
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          }
          chmod 600 "$KS"

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=]+$' "$KS"; then
              if base64 --decode "$KS" > "$DECODED_KS" 2>/dev/null &&
                 keytool -list -keystore "$DECODED_KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
                mv "$DECODED_KS" "$KS"
              else
                rm -f "$DECODED_KS"
              fi
            fi
          fi

          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1 || {
            echo "::error::APKSIGN keystore cannot be opened with STORE_PASSWORD."
            exit 1
          }

          # apksigner reports PKCS12KeyStore for the APKSIGN keystore. In PKCS12,
          # the private-key password is the keystore password; passing a different
          # key password causes UnrecoverableKeyException/BadPaddingException.
          STORE_TYPE="$(keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Keystore type: //p' | head -n1 | tr -d '\r')"
          echo "Detected keystore type: $STORE_TYPE"

          if [ "$STORE_TYPE" = "PKCS12" ]; then
            echo "APKSIGN_KEY_PASSWORD_MODE=store" >> "$GITHUB_ENV"
            echo "::notice::PKCS12 keystore detected; apksigner will use STORE_PASSWORD for the private key."
          else
            test -n "$KEY_PASSWORD" || { echo "::error::ANDROID_SIGNING_KEY_PASSWORD is empty."; exit 1; }

            if keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD"                 -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
              echo "APKSIGN_KEY_PASSWORD_MODE=key" >> "$GITHUB_ENV"
            elif keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD"                 -alias "$KEY_ALIAS" -keypass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "APKSIGN_KEY_PASSWORD_MODE=store" >> "$GITHUB_ENV"
              echo "::notice::The private-key password equals STORE_PASSWORD."
            else
              echo "::error::The keystore is valid, but KEY_ALIAS/KEY_PASSWORD cannot unlock the private key."
              exit 1
            fi
          fi

      - name: Align release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="$RUNNER_TEMP/SoBanHang-aligned.apk"

          test -f "$INPUT"
          "$BT/zipalign" -f -p 4 "$INPUT" "$OUTPUT"

      - name: Sign with APKSIGN release key
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          case "${APKSIGN_KEY_PASSWORD_MODE:-key}" in
            store) EFFECTIVE_KEY_PASSWORD="$STORE_PASSWORD" ;;
            key)   EFFECTIVE_KEY_PASSWORD="$KEY_PASSWORD" ;;
            *)     echo "::error::Invalid APKSIGN key-password mode."; exit 1 ;;
          esac

          "$BT/apksigner" sign             --ks "$RUNNER_TEMP/khahdihdz-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$STORE_PASSWORD"             --key-pass "pass:$EFFECTIVE_KEY_PASSWORD"             --out "$RUNNER_TEMP/SoBanHang.apk"             "$RUNNER_TEMP/SoBanHang-aligned.apk"

      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/SoBanHang.apk"

      - name: Upload signed APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SoBanHang
          path: ${{ runner.temp }}/SoBanHang.apk
          if-no-files-found: error

      - name: Release signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/SoBanHang.apk
