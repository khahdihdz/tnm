name: Build and Sign Sổ Bán Hàng

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Prepare signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/apksigner" --version
      - name: Restore APKSIGN keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"

          KS="$RUNNER_TEMP/khahdihdz-release.jks"
          CLEAN_B64="$RUNNER_TEMP/keystore.b64"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > "$CLEAN_B64"
          base64 --decode "$CLEAN_B64" > "$KS"
          chmod 600 "$KS"

          # Accept both normal Base64 and an accidentally double-encoded Base64 keystore.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=]+      - name: Align release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/SoBanHang-aligned.apk"
      - name: Sign with APKSIGN release key
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/khahdihdz-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$RUNNER_TEMP/SoBanHang.apk" "$RUNNER_TEMP/SoBanHang-aligned.apk"
      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/SoBanHang.apk"
      - name: Upload signed APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SoBanHang
          path: ${{ runner.temp }}/SoBanHang.apk
          if-no-files-found: error
      - name: Release signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/SoBanHang.apk
 "$KS"; then
              base64 --decode "$KS" > "$RUNNER_TEMP/khahdihdz-release-decoded.jks"
              mv "$RUNNER_TEMP/khahdihdz-release-decoded.jks" "$KS"
            fi
          fi

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 does not contain a valid keystore for ANDROID_SIGNING_STORE_PASSWORD."
            echo "The signing key secret must be Base64 of the actual .jks/.keystore file, not an invalid or truncated value."
            exit 1
          fi
      - name: Align release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/SoBanHang-aligned.apk"
      - name: Sign with APKSIGN release key
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/khahdihdz-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$RUNNER_TEMP/SoBanHang.apk" "$RUNNER_TEMP/SoBanHang-aligned.apk"
      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/SoBanHang.apk"
      - name: Upload signed APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SoBanHang
          path: ${{ runner.temp }}/SoBanHang.apk
          if-no-files-found: error
      - name: Release signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/SoBanHang.apk
